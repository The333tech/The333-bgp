services:
  the333-bgp-backend:
    environment:
      SESSION_COOKIE_SECURE: "true"

  the333-portal:
    ports: !override
      - "${THE333_BIND_IP:-${ROUTER_ID:?THE333_BIND_IP or ROUTER_ID must be set}}:8090:443"
    volumes:
      - ./portal/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PORTAL_TLS_CERT_PATH:-/etc/the333-bgp/tls/portal.crt}:/etc/nginx/tls/portal.crt:ro
      - ${PORTAL_TLS_KEY_PATH:-/etc/the333-bgp/tls/portal.key}:/etc/nginx/tls/portal.key:ro
