name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  GRYPE_VERSION: v0.112.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Validate tag and release tree
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          sudo apt-get update
          sudo apt-get install -y shellcheck
          THE333_REQUIRE_TRACKED_RELEASE_FILES=true ./scripts/release-check.sh

      - name: Run backend tests and dependency audit
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install pip-audit
          python3 -m unittest discover -s tests -v
          python3 -m pip_audit -r requirements.txt

      - name: Build and audit portal
        working-directory: portal
        run: |
          npm ci
          npm test
          npm run build
          npm audit --omit=dev --audit-level=moderate

  images:
    name: Publish ${{ matrix.service }} image
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            image: the333-bgp-core
            context: .
            dockerfile: docker/gobgp.Dockerfile
          - service: backend
            image: the333-bgp-backend
            context: .
            dockerfile: docker/backend.Dockerfile
          - service: portal
            image: the333-bgp-portal
            context: portal
            dockerfile: portal/Dockerfile

    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; image tags are immutable." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/the333tech/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/the333tech/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            PRODUCT_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            GOBGP_CORE_IMAGE_VERSION=4.7.0-r5
          cache-from: type=gha,scope=runtime-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Scan release image for fixable High/Critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/the333tech/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Attest release image
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/the333tech/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image reference
        shell: bash
        run: |
          mkdir -p dist/image-digests
          printf '%s@%s\n' \
            'ghcr.io/the333tech/${{ matrix.image }}' \
            '${{ steps.push.outputs.digest }}' \
            > 'dist/image-digests/${{ matrix.service }}.ref'

      - name: Upload image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ matrix.service }}
          path: dist/image-digests/${{ matrix.service }}.ref
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish release
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Download immutable image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-*
          path: dist/image-digests
          merge-multiple: true

      - name: Build release assets
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          archive="the333-bgp-v${version}.tar.gz"
          mkdir -p dist/release-tree
          git archive --format=tar.gz --prefix="The333-bgp-v${version}/" --output=dist/source-tree.tar.gz HEAD
          python3 scripts/extract-release.py dist/source-tree.tar.gz dist/release-tree
          python3 - "${version}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          source = Path("dist/release-tree/update-manifest.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          matches = [item for item in manifest.get("versions", []) if str(item.get("version")) == version]
          if len(matches) != 1:
              raise SystemExit(f"manifest must contain exactly one entry for version {version}")

          repositories = {
              "core": "ghcr.io/the333tech/the333-bgp-core",
              "backend": "ghcr.io/the333tech/the333-bgp-backend",
              "portal": "ghcr.io/the333tech/the333-bgp-portal",
          }
          images = {}
          for name, repository in repositories.items():
              reference = Path(f"dist/image-digests/{name}.ref").read_text(encoding="utf-8").strip()
              if not re.fullmatch(rf"{re.escape(repository)}@sha256:[0-9a-f]{{64}}", reference):
                  raise SystemExit(f"invalid immutable image reference for {name}")
              images[name] = reference
          matches[0]["images"] = images
          source.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          source_date_epoch="$(git log -1 --format=%ct HEAD)"
          package_root="dist/package/The333-bgp-v${version}"
          mkdir -p "${package_root}"
          cp -a dist/release-tree/. "${package_root}/"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist/package \
            -czf "dist/${archive}" \
            "The333-bgp-v${version}"
          sha="$(sha256sum "dist/${archive}" | awk '{print $1}')"
          python3 - "${version}" "${archive}" "${sha}" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, archive, sha256 = sys.argv[1:]
          source = Path("dist/release-tree/update-manifest.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          matches = [item for item in manifest.get("versions", []) if str(item.get("version")) == version]
          if len(matches) != 1:
              raise SystemExit(f"manifest must contain exactly one entry for version {version}")
          matches[0]["archive_url"] = f"https://github.com/The333tech/The333-bgp/releases/download/v{version}/{archive}"
          matches[0]["sha256"] = sha256
          Path("dist/update-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 - "${version}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^##\s+{re.escape(version)}(?:\s|$).*?(?=^##\s+|\Z)",
              changelog,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          Path("dist/RELEASE_NOTES.md").write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/release-tree
          format: spdx-json
          output-file: dist/the333-bgp.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan release SBOM for fixable High/Critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: dist/the333-bgp.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Calculate release checksums
        run: |
          cd dist
          sha256sum the333-bgp-v*.tar.gz update-manifest.json the333-bgp.spdx.json > SHA256SUMS

      - name: Attest release provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest release SBOM
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/the333-bgp-v*.tar.gz
          sbom-path: dist/the333-bgp.spdx.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          channel="$(python3 - "${version}" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifest = json.loads(Path("update-manifest.json").read_text(encoding="utf-8"))
          matches = [item for item in manifest.get("versions", []) if str(item.get("version")) == version]
          if len(matches) != 1:
              raise SystemExit(f"manifest must contain exactly one entry for version {version}")
          print(str(matches[0].get("channel", "stable")))
          PY
          )"
          title="The333-BGP v${version}"
          if [ "${channel}" = "beta" ]; then
            release_state=(--prerelease)
          else
            release_state=(--latest)
          fi
          assets=(
            "dist/the333-bgp-v${version}.tar.gz"
            "dist/update-manifest.json"
            "dist/the333-bgp.spdx.json"
            "dist/SHA256SUMS"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists. Published release assets are immutable." >&2
            exit 1
          fi
          gh release create "${tag}" "${assets[@]}" \
            --verify-tag \
            "${release_state[@]}" \
            --title "${title}" \
            --notes-file dist/RELEASE_NOTES.md
