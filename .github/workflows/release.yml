name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Validate tag and release tree
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          sudo apt-get update
          sudo apt-get install -y shellcheck
          THE333_REQUIRE_TRACKED_RELEASE_FILES=true ./scripts/release-check.sh

      - name: Run backend tests and dependency audit
        run: |
          python3 -m pip install --require-hashes -r requirements.txt
          python3 -m pip install pip-audit
          python3 -m unittest discover -s tests -v
          python3 -m pip_audit -r requirements.txt

      - name: Build and audit portal
        working-directory: portal
        run: |
          npm ci
          npm test
          npm run build
          npm audit --omit=dev --audit-level=moderate

      - name: Build release assets
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          archive="the333-bgp-v${version}.tar.gz"
          mkdir -p dist
          git archive --format=tar.gz --prefix="The333-bgp-v${version}/" --output="dist/${archive}" HEAD
          sha="$(sha256sum "dist/${archive}" | awk '{print $1}')"
          python3 - "${version}" "${archive}" "${sha}" <<'PY'
          import json
          import sys
          from pathlib import Path

          version, archive, sha256 = sys.argv[1:]
          source = Path("update-manifest.json")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          release_url = f"https://github.com/The333tech/The333-bgp/releases/download/v{version}/{archive}"

          matches = [item for item in manifest.get("versions", []) if str(item.get("version")) == version]
          if len(matches) != 1:
              raise SystemExit(f"manifest must contain exactly one entry for version {version}")

          matches[0]["archive_url"] = release_url
          matches[0]["sha256"] = sha256
          Path("dist/update-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 - "${version}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^##\s+{re.escape(version)}(?:\s|$).*?(?=^##\s+|\Z)",
              changelog,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          Path("dist/RELEASE_NOTES.md").write_text(match.group(0).strip() + "\n", encoding="utf-8")
          PY

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/the333-bgp.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan release SBOM for fixable Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: dist/the333-bgp.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          cache-db: true

      - name: Calculate release checksums
        run: |
          cd dist
          sha256sum the333-bgp-v*.tar.gz update-manifest.json the333-bgp.spdx.json > SHA256SUMS

      - name: Attest release provenance
        if: github.event.repository.private == false
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest release SBOM
        if: github.event.repository.private == false
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/the333-bgp-v*.tar.gz
          sbom-path: dist/the333-bgp.spdx.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          channel="$(python3 - "${version}" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          manifest = json.loads(Path("update-manifest.json").read_text(encoding="utf-8"))
          matches = [item for item in manifest.get("versions", []) if str(item.get("version")) == version]
          if len(matches) != 1:
              raise SystemExit(f"manifest must contain exactly one entry for version {version}")
          print(str(matches[0].get("channel", "stable")))
          PY
          )"
          title="The333-BGP v${version}"
          if [ "${channel}" = "beta" ]; then
            release_state=(--prerelease)
          else
            release_state=(--latest)
          fi
          assets=(
            "dist/the333-bgp-v${version}.tar.gz"
            "dist/update-manifest.json"
            "dist/the333-bgp.spdx.json"
            "dist/SHA256SUMS"
          )

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists. Published release assets are immutable." >&2
            exit 1
          fi
          gh release create "${tag}" "${assets[@]}" \
            --verify-tag \
            "${release_state[@]}" \
            --title "${title}" \
            --notes-file dist/RELEASE_NOTES.md
