name: Build GHCR image candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  GRYPE_VERSION: v0.120.1
  REGISTRY: ghcr.io

concurrency:
  group: ghcr-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }} candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            image: the333-bgp-core
            context: .
            dockerfile: docker/gobgp.Dockerfile
          - service: backend
            image: the333-bgp-backend
            context: .
            dockerfile: docker/backend.Dockerfile
          - service: portal
            image: the333-bgp-portal
            context: portal
            dockerfile: portal/Dockerfile

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read product version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform candidate
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/the333tech/${{ matrix.image }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            PRODUCT_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            GOBGP_CORE_IMAGE_VERSION=4.9.0-r2
          cache-from: type=gha,scope=runtime-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Scan pushed candidate for fixable High/Critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.REGISTRY }}/the333tech/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Attest candidate image
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/the333tech/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record immutable candidate reference
        shell: bash
        run: |
          mkdir -p dist/image-digests
          printf '%s@%s\n' \
            '${{ env.REGISTRY }}/the333tech/${{ matrix.image }}' \
            '${{ steps.push.outputs.digest }}' \
            > 'dist/image-digests/${{ matrix.service }}.ref'
          python3 scripts/measure-image-storage.py \
            "$(cat 'dist/image-digests/${{ matrix.service }}.ref')" \
            'dist/image-digests/${{ matrix.service }}.storage.json'

      - name: Upload candidate reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-${{ matrix.service }}-${{ github.sha }}
          path: dist/image-digests/${{ matrix.service }}.*
          if-no-files-found: error
          retention-days: 14

  clean-install:
    name: Test candidate delivery
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/delivery.yml
    with:
      image-artifact-pattern: ghcr-*-${{ github.sha }}
