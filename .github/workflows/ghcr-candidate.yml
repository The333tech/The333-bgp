name: Build GHCR image candidate

on:
  workflow_dispatch:

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  GRYPE_VERSION: v0.112.0
  REGISTRY: ghcr.io

concurrency:
  group: ghcr-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }} candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core
            image: the333-bgp-core
            context: .
            dockerfile: docker/gobgp.Dockerfile
          - service: backend
            image: the333-bgp-backend
            context: .
            dockerfile: docker/backend.Dockerfile
          - service: portal
            image: the333-bgp-portal
            context: portal
            dockerfile: portal/Dockerfile

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read product version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform candidate
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/the333tech/${{ matrix.image }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            PRODUCT_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            GOBGP_CORE_IMAGE_VERSION=4.7.0-r5
          cache-from: type=gha,scope=runtime-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Scan pushed candidate for fixable High/Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.REGISTRY }}/the333tech/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Attest candidate image
        if: github.event.repository.private == false
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY }}/the333tech/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record immutable candidate reference
        shell: bash
        run: |
          mkdir -p dist/image-digests
          printf '%s@%s\n' \
            '${{ env.REGISTRY }}/the333tech/${{ matrix.image }}' \
            '${{ steps.push.outputs.digest }}' \
            > 'dist/image-digests/${{ matrix.service }}.ref'

      - name: Upload candidate reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-${{ matrix.service }}-${{ github.sha }}
          path: dist/image-digests/${{ matrix.service }}.ref
          if-no-files-found: error
          retention-days: 14
