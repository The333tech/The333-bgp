name: Test prebuilt delivery

on:
  workflow_call:
    inputs:
      image-artifact-pattern:
        required: true
        type: string
      release-artifact:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  lifecycle:
    name: Native ${{ matrix.arch }} install, update and recovery
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download immutable image references
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.image-artifact-pattern }}
          path: dist/image-digests
          merge-multiple: true

      - name: Exercise real prebuilt delivery on a disposable runner
        if: inputs.release-artifact == ''
        run: python3 tests/delivery_smoke.py --images-dir dist/image-digests

      - name: Download packaged release
        if: inputs.release-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release-artifact }}
          path: dist/release-assets

      - name: Test exact release archive before publication
        if: inputs.release-artifact != ''
        run: python3 tests/delivery_smoke.py --images-dir dist/image-digests --release-assets dist/release-assets

      - name: Save delivery result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/the333-delivery-fixture/result.json
          if-no-files-found: warn
          retention-days: 7
