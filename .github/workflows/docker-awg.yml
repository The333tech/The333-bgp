name: Build docker-awg candidate

on:
  workflow_dispatch:

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }} candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm-v7
            platform: linux/arm/v7
          - name: arm64
            platform: linux/arm64
          - name: amd64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Prepare artifact directory
        run: mkdir -p dist/docker-awg

      - name: Build RouterOS image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: extras/docker-awg
          platforms: ${{ matrix.platform }}
          tags: the333/docker-awg:${{ matrix.name }}-candidate
          outputs: type=docker,dest=dist/docker-awg/docker-awg-${{ matrix.name }}.tar
          cache-from: type=gha,scope=docker-awg-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=docker-awg-${{ matrix.name }}
          provenance: false

      - name: Smoke-test binaries under QEMU
        run: |
          docker load --input "dist/docker-awg/docker-awg-${{ matrix.name }}.tar"
          docker run --rm --platform "${{ matrix.platform }}" \
            "the333/docker-awg:${{ matrix.name }}-candidate" --self-test

      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/docker-awg/docker-awg-${{ matrix.name }}.tar
          format: spdx-json
          output-file: dist/docker-awg/docker-awg-${{ matrix.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan candidate for fixable Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: dist/docker-awg/docker-awg-${{ matrix.name }}.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          cache-db: true

      - name: Calculate checksum
        run: |
          cd dist/docker-awg
          sha256sum \
            "docker-awg-${{ matrix.name }}.tar" \
            "docker-awg-${{ matrix.name }}.spdx.json" \
            > "docker-awg-${{ matrix.name }}.sha256"

      - name: Attest candidate provenance
        if: github.event.repository.private == false
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/docker-awg/docker-awg-${{ matrix.name }}.sha256

      - name: Attest candidate SBOM
        if: github.event.repository.private == false
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/docker-awg/docker-awg-${{ matrix.name }}.tar
          sbom-path: dist/docker-awg/docker-awg-${{ matrix.name }}.spdx.json

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-awg-${{ matrix.name }}-candidate
          path: dist/docker-awg/
          if-no-files-found: error
          retention-days: 14
