name: Build docker-awg candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - "extras/docker-awg/**"
      - ".github/workflows/docker-awg.yml"
  workflow_dispatch:

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write

env:
  GRYPE_VERSION: v0.112.0

jobs:
  build:
    name: Build ${{ matrix.name }} candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm-v7
            platform: linux/arm/v7
          - name: arm64
            platform: linux/arm64
          - name: amd64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Prepare artifact directory
        run: mkdir -p dist/docker-awg

      - name: Build RouterOS image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: extras/docker-awg
          platforms: ${{ matrix.platform }}
          tags: the333/docker-awg:${{ matrix.name }}-candidate
          outputs: type=docker,dest=dist/docker-awg/docker-awg-${{ matrix.name }}.tar
          cache-from: type=gha,scope=docker-awg-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=docker-awg-${{ matrix.name }}
          provenance: false

      - name: Smoke-test binaries under QEMU
        run: |
          docker load --input "dist/docker-awg/docker-awg-${{ matrix.name }}.tar"
          docker run --rm --platform "${{ matrix.platform }}" \
            "the333/docker-awg:${{ matrix.name }}-candidate" --self-test

      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/docker-awg/docker-awg-${{ matrix.name }}.tar
          format: spdx-json
          output-file: dist/docker-awg/docker-awg-${{ matrix.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan candidate for fixable High/Critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: dist/docker-awg/docker-awg-${{ matrix.name }}.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Calculate checksum
        run: |
          cd dist/docker-awg
          sha256sum \
            "docker-awg-${{ matrix.name }}.tar" \
            "docker-awg-${{ matrix.name }}.spdx.json" \
            > "docker-awg-${{ matrix.name }}.sha256"

      - name: Attest candidate provenance
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/docker-awg/docker-awg-${{ matrix.name }}.sha256

      - name: Attest candidate SBOM
        if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/docker-awg/docker-awg-${{ matrix.name }}.tar
          sbom-path: dist/docker-awg/docker-awg-${{ matrix.name }}.spdx.json

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-awg-${{ matrix.name }}-candidate
          path: dist/docker-awg/
          if-no-files-found: error
          retention-days: 14
