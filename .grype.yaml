# Narrow, reviewed exceptions for the pinned CPython runtime.
# CVE-2026-15308 affects html/html.parser. The backend neither imports nor
# executes those modules, and no external input is parsed through them.
# CVE-2026-11940 and CVE-2026-11972 affect tarfile extraction and streaming.
# The backend runtime neither imports tarfile nor processes tar archives.
# The published fixes require Python 3.15 beta; moving production to a beta
# interpreter would introduce more risk. Re-evaluate on every Python update.
ignore:
  - vulnerability: CVE-2026-15308
    package:
      name: python
      version: 3.14.7
      type: binary
  - vulnerability: CVE-2026-11940
    package:
      name: python
      version: 3.14.7
      type: binary
  - vulnerability: CVE-2026-11972
    package:
      name: python
      version: 3.14.7
      type: binary
