services:
  the333-portal:
    image: "the333-bgp-portal:${PRODUCT_VERSION:-dev}"
    build:
      context: ./portal
      args:
        PRODUCT_VERSION: "${PRODUCT_VERSION:-dev}"
        VCS_REF: "${VCS_REF:-unknown}"
    container_name: the333-portal
    user: "${PUID}:${PGID}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755,uid=${PUID},gid=${PGID}
      - /var/run:size=4m,mode=0755,uid=${PUID},gid=${PGID}
      - /tmp:size=16m,mode=1777
    ports:
      - "${THE333_BIND_IP:-${ROUTER_ID:?THE333_BIND_IP or ROUTER_ID must be set}}:8090:8080"
    depends_on:
      the333-bgp-backend:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
